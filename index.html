<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafa"><meta name="description" content="MemoryAstra：记录背诵内容，按日期复习。"><title>MemoryAstra</title><link rel="icon" type="image/svg+xml" href="galaxy.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./" aria-label="MemoryAstra 首页"><img src="galaxy.svg" width="32" height="32" alt=""><span>MemoryAstra</span></a><div class="tools"><button id="export">导出备份</button><button id="import">导入</button><input type="file" id="file" accept=".json,application/json" hidden></div></header>
<main><div id="warning" role="alert" hidden></div><div class="workspace">
<aside><div class="time"><h2>时光机</h2><label for="date">查看日期</label><input type="date" id="date" min="1900-01-01" max="2100-12-31"><div class="date-nav"><button id="prev" aria-label="前一天">←</button><button id="today">回到今天</button><button id="next" aria-label="后一天">→</button></div><div class="month-nav"><button id="prevMonth" aria-label="上个月">‹</button><strong id="monthLabel"></strong><button id="nextMonth" aria-label="下个月">›</button></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar"></div><p class="calendar-note">日期下的圆点表示有复习安排</p></div><details class="help"><summary>复习规则与数据</summary><p>保存后 25 分钟，以及背诵后第 1、2、4、7、15、30 天复习。漏掉的任务保留在逾期待补中。</p><p>数据保存在当前浏览器，不自动跨设备同步。请定期导出备份。</p></details></aside>
<section class="content"><div class="view-heading"><div><div class="heading-line"><h1 id="dayTitle"></h1><span class="badge" id="todayBadge"></span></div><div class="stats"><span>安排 <strong id="planned">0</strong></span><span>已完成 <strong id="finished">0</strong></span><span>此前未完成 <strong id="late">0</strong></span></div></div><button class="primary" id="add">＋ 新增内容</button></div><p id="travelNote" class="muted" hidden></p><nav class="tabs" aria-label="内容视图"><button data-tab="due" class="active">复习清单</button><button data-tab="all">全部内容</button></nav><div class="filterbar"><input id="search" type="search" placeholder="搜索内容" aria-label="搜索内容"><label><input id="showDone" type="checkbox"> 显示已完成</label></div><div id="list"></div></section></div></main>
<dialog id="editor"><form id="form"><div class="section-title"><h2 id="editorTitle">新增背诵内容</h2><button type="button" id="close" aria-label="关闭">✕</button></div><label for="title">标题</label><input id="title" maxlength="120" placeholder="例如：今天的英语词汇" required><div class="form-row"><div><label for="subject">科目 / 标签</label><input id="subject" maxlength="40" placeholder="例如：English"></div><div><label for="learned">首次背诵日期</label><input id="learned" type="date" min="1900-01-01" required></div></div><label for="body">背诵内容</label><textarea id="body" rows="10" maxlength="100000" placeholder="粘贴单词、定义、笔记或需要背诵的原文…" required></textarea><p id="formNote" class="muted">今天的内容会在保存约 25 分钟后首次到期。也可补录过去的背诵。</p><div class="form-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存内容</button></div></form></dialog><div id="toast" role="status"></div><script src="core.js"></script><script src="app.js"></script></body></html>
